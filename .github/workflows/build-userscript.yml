name: Build and publish Uyen Ni Userscript

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "userscript/safari-bootstrap.js"
      - "scripts/**"
      - ".github/workflows/build-userscript.yml"
  pull_request:
    paths:
      - "extension/**"
      - "userscript/safari-bootstrap.js"
      - "scripts/**"
      - ".github/workflows/build-userscript.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: userscript-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate and validate userscript
        run: |
          node scripts/build-userscript.cjs
          node scripts/build-userscript.cjs --check
          node --check userscript/spx-operations-tools-safari.user.js
          node --test scripts/userscript.test.cjs

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build next version
        run: |
          node scripts/build-userscript.cjs --release
          node scripts/build-userscript.cjs --check
          node --check userscript/spx-operations-tools-safari.user.js
          node --test scripts/userscript.test.cjs
      - name: Commit published userscript and metadata to main
        shell: bash
        run: |
          git add extension/manifest.json userscript/spx-operations-tools-safari.user.js userscript/spx-operations-tools-safari.meta.js
          if git diff --cached --quiet; then
            echo "Published Userscript is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(userscript): publish GitHub auto-update [skip ci]"
          git push origin HEAD:main
