<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c45d7c">
  <meta name="description" content="Pleiku 03 - Audit workspace">
  <title>Pleiku 03 · Audit workspace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c45d7c'/%3E%3Cpath d='M18 32l9 9 19-21' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg:#faf8f9;
      --surface:#fff;
      --surface-2:#fcfafb;
      --text:#41363b;
      --muted:#786970;
      --line:#eadde2;
      --primary:#c45d7c;
      --primary-dark:#9f4664;
      --primary-soft:#f3e5ea;
      --rose:#be365f;
      --amber:#b66a10;
      --green:#15845a;
      --shadow:0 12px 34px rgba(75,55,64,.08);
      --radius:18px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color-scheme:light;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.45}
    a{color:inherit;text-decoration:none}
    .shell{min-height:100vh;padding-bottom:92px}
    .topbar{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);background:rgba(255,255,255,.95);backdrop-filter:blur(14px)}
    .topbar-inner{max-width:1200px;height:64px;margin:auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:11px;min-width:0;border:0;background:none;padding:0;text-align:left;color:inherit}
    .brand-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:var(--primary);color:white;font-size:20px;font-weight:900;box-shadow:0 5px 14px rgba(196,93,124,.22)}
    .brand-meta{min-width:0}
    .brand-overline{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:#a76579}
    .brand-title{display:block;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .desktop-nav{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2)}
    .nav-btn{min-height:39px;padding:0 13px;border:0;border-radius:9px;background:transparent;color:#6d5d64;font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px}
    .nav-btn:hover{background:white;color:var(--primary-dark)}
    .nav-btn.active{background:var(--primary-soft);color:var(--primary-dark)}
    .content{max-width:1200px;margin:auto;padding:26px 18px 38px}
    .page{display:grid;gap:20px}
    .page-heading{display:flex;align-items:end;justify-content:space-between;gap:16px}
    .kicker{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#a76579}
    h1,h2,h3,p{margin-top:0}
    h1{margin-bottom:8px;font-size:clamp(30px,5vw,42px);line-height:1.05;letter-spacing:-.035em}
    h2{margin-bottom:8px}
    .lead{max-width:760px;margin-bottom:0;color:var(--muted);font-size:14px;line-height:1.75;font-weight:550}
    .card{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
    .hero{padding:clamp(22px,5vw,34px)}
    .hero h1{max-width:780px;font-size:clamp(32px,7vw,52px);line-height:1.07}
    .hero-actions{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px}
    .btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:white;padding:0 16px;color:#65555c;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:none}
    .btn:hover{background:#faf4f6}
    .btn-primary{border-color:var(--primary);background:var(--primary);color:white}
    .btn-primary:hover{background:#b85171}
    .btn-danger{color:#a9274d}
    .grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .feature{padding:20px;transition:.15s ease}
    .feature:hover{transform:translateY(-1px);border-color:#dcb8c4}
    .feature-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--primary-soft);font-size:20px}
    .feature h3{margin:14px 0 6px;font-size:17px}
    .feature p{margin:0;color:var(--muted);font-size:13px;line-height:1.65;font-weight:550}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .stat{padding:18px}
    .stat-label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#817078}
    .stat-value{margin-top:7px;font-size:30px;font-weight:950}
    .stat.amber .stat-label,.stat.amber .stat-value{color:var(--amber)}
    .stat.rose .stat-label,.stat.rose .stat-value{color:var(--rose)}
    .panel{overflow:hidden}
    .toolbar{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:11px}
    .filter-grid{display:grid;grid-template-columns:minmax(0,1fr) 210px 190px;gap:10px}
    .field-wrap{position:relative}
    .field-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#a68591;pointer-events:none}
    .input,.select,.textarea{width:100%;border:1px solid #e6d9de;border-radius:12px;background:var(--surface-2);color:var(--text);outline:none;transition:.15s ease}
    .input,.select{min-height:44px;padding:0 13px}
    .input.with-icon{padding-left:40px}
    .textarea{min-height:210px;padding:14px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.65}
    .input:focus,.select:focus,.textarea:focus{border-color:#c98ba0;background:white;box-shadow:0 0 0 3px rgba(196,93,124,.08)}
    .select{font-weight:750}
    .toolbar-note{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#8d7982;font-size:12px;font-weight:700}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:980px}
    th,td{padding:13px 14px;border-bottom:1px solid #eee5e8;text-align:left;vertical-align:middle}
    th{background:#faf7f8;color:#6f5f66;font-size:11px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
    td{font-size:13px;color:#5e4f56}
    tbody tr:hover{background:#fcfafb}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .strong{font-weight:900;color:#493a40}
    .badge{display:inline-flex;align-items:center;border:1px solid #e6d9de;border-radius:9px;padding:5px 9px;background:#faf8f9;font-size:11px;font-weight:900;white-space:nowrap}
    .badge.rose{border-color:#ffd1dc;background:#fff0f4;color:#a9274d}
    .badge.amber{border-color:#f7dfae;background:#fff8e8;color:#9e5b07}
    .badge.green{border-color:#bfe8d5;background:#eefbf5;color:#11734e}
    .status-code{display:inline-block;padding:3px 7px;border-radius:7px;background:var(--primary-soft);color:var(--primary-dark);font-size:11px;font-weight:950}
    .status-label{margin-top:4px;max-width:220px;color:#6f5f66;font-size:11px;font-weight:700;overflow-wrap:anywhere}
    .pager{padding:15px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line)}
    .pager-info{font-size:12px;font-weight:800;color:#7f6c75}
    .pager-actions{display:flex;align-items:center;gap:8px}
    .pager-page{min-width:88px;text-align:center;font-size:12px;font-weight:850;color:#7f6c75}
    .empty,.loading{padding:44px 18px;text-align:center;color:#87747c;font-weight:750;font-size:14px}
    .loading::before{content:"";display:block;width:28px;height:28px;margin:0 auto 12px;border-radius:50%;border:3px solid #eadde2;border-top-color:var(--primary);animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .mobile-list{display:none}
    .mobile-card{padding:15px;display:grid;gap:12px;border-bottom:1px solid #eee5e8}
    .mobile-card:last-child{border-bottom:0}
    .mobile-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:#8b7780}
    .value{margin-top:3px;font-size:13px;font-weight:700;color:#55464d;overflow-wrap:anywhere}
    .mobile-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .settings{max-width:760px;margin:auto;display:grid;gap:18px}
    .settings-head{padding:18px;border-bottom:1px solid var(--line);background:#faf7f8;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .settings-body{padding:18px;display:grid;gap:13px}
    .settings-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
    .notice{padding:18px;display:grid;gap:12px}
    .notice-icon{width:42px;height:42px;border-radius:12px;background:var(--primary-soft);display:grid;place-items:center;font-size:20px}
    .notice p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}
    .footer{padding:4px 0 14px;text-align:center;color:#927e87;font-size:11px;font-weight:650}
    .bottom-nav{display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:40;max-width:440px;margin:auto;padding:6px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.96);box-shadow:0 12px 35px rgba(75,55,64,.14);backdrop-filter:blur(14px);grid-template-columns:repeat(4,1fr)}
    .bottom-nav .nav-btn{min-height:54px;padding:5px 3px;display:flex;flex-direction:column;gap:2px;font-size:10px}
    .toast-stack{position:fixed;top:78px;right:16px;z-index:100;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
    .toast{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:white;box-shadow:0 14px 32px rgba(75,55,64,.16);font-size:13px;font-weight:750;animation:toastIn .18s ease-out}
    .toast.success{border-color:#bfe8d5;color:#11734e}
    .toast.error{border-color:#ffd1dc;color:#a9274d}
    .toast.info{color:#725862}
    @keyframes toastIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
    .hidden{display:none!important}
    @media(max-width:820px){
      .desktop-nav{display:none}
      .bottom-nav{display:grid}
      .grid-3,.stats{grid-template-columns:1fr}
      .filter-grid{grid-template-columns:1fr}
      .page-heading{align-items:flex-start;flex-direction:column}
      .page-heading .btn{width:100%}
      .desktop-table{display:none}
      .mobile-list{display:block}
      .pager{align-items:stretch;flex-direction:column}
      .pager-actions{justify-content:space-between}
      .pager .btn{flex:1}
      .hero-actions{flex-direction:column}
      .hero-actions .btn{width:100%}
    }
    @media(min-width:821px){.shell{padding-bottom:0}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <button class="brand" type="button" data-go="/">
          <span class="brand-icon">✓</span>
          <span class="brand-meta">
            <span class="brand-overline">SPX Operations</span>
            <span class="brand-title">Pleiku 03 · Audit workspace</span>
          </span>
        </button>
        <nav class="desktop-nav" aria-label="Điều hướng chính">
          <button class="nav-btn" type="button" data-route="/" data-go="/">⌂ Trang chủ</button>
          <button class="nav-btn" type="button" data-route="/doi-soat" data-go="/doi-soat">✓ Đối soát</button>
          <button class="nav-btn" type="button" data-route="/fms" data-go="/fms">▦ FMS</button>
          <button class="nav-btn" type="button" data-route="/cai-dat" data-go="/cai-dat">⚿ Cookie</button>
        </nav>
      </div>
    </header>

    <main id="app" class="content"></main>

    <nav class="bottom-nav" aria-label="Điều hướng mobile">
      <button class="nav-btn" type="button" data-route="/" data-go="/"><span>⌂</span><span>Trang chủ</span></button>
      <button class="nav-btn" type="button" data-route="/doi-soat" data-go="/doi-soat"><span>✓</span><span>Đối soát</span></button>
      <button class="nav-btn" type="button" data-route="/fms" data-go="/fms"><span>▦</span><span>FMS</span></button>
      <button class="nav-btn" type="button" data-route="/cai-dat" data-go="/cai-dat"><span>⚿</span><span>Cookie</span></button>
    </nav>
  </div>

  <div id="toasts" class="toast-stack" aria-live="polite"></div>

  <script>
  (function () {
    "use strict";

    var PAGE_SIZE = 20;
    var STORAGE_KEY = "spx-audit-config";
    var LEGACY_STORAGE_KEY = "configs";

    var state = {
      route: "/",
      doi: {
        loaded: false,
        loading: false,
        rows: [],
        total: 0,
        count24To36: 0,
        countOver36: 0,
        search: "",
        aging: "ALL",
        bulky: "ALL",
        page: 1
      },
      fms: {
        loaded: false,
        loading: false,
        rows: [],
        total: 0,
        search: "",
        elapsed: "ALL",
        status: "ALL",
        page: 1,
        nowMs: Date.now()
      }
    };

    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeText(value) {
      return value == null ? "" : String(value).trim();
    }

    function getErrorMessage(error) {
      if (!error) return "Không thể kết nối Google Apps Script.";
      if (typeof error === "string") return error;
      if (error.message) return String(error.message);
      return "Không thể kết nối Google Apps Script.";
    }

    function toast(message, type) {
      var host = document.getElementById("toasts");
      var item = document.createElement("div");
      item.className = "toast " + (type || "info");
      item.textContent = message;
      host.appendChild(item);
      window.setTimeout(function () {
        item.remove();
      }, 3200);
    }

    function gasCall(method, args) {
      return new Promise(function (resolve, reject) {
        if (!window.google || !google.script || !google.script.run) {
          reject(new Error("Trang này cần chạy bằng Google Apps Script Web App."));
          return;
        }

        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (error) {
            reject(new Error(getErrorMessage(error)));
          });

        if (method === "getDoiSoatRaw") {
          runner.getDoiSoatRaw();
          return;
        }

        if (method === "getFmsData") {
          runner.getFmsData(args[0], args[1]);
          return;
        }

        reject(new Error("Không hỗ trợ hàm GAS: " + method));
      });
    }

    function getConfig() {
      var keys = [STORAGE_KEY, LEGACY_STORAGE_KEY];
      for (var i = 0; i < keys.length; i += 1) {
        try {
          var raw = localStorage.getItem(keys[i]);
          if (!raw) continue;
          var parsed = JSON.parse(raw);
          return { cookies: typeof parsed.cookies === "string" ? parsed.cookies : "" };
        } catch (_) {}
      }
      return { cookies: "" };
    }

    function saveConfig(cookies) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ cookies: normalizeText(cookies) }));
      localStorage.removeItem(LEGACY_STORAGE_KEY);
    }

    function currentPath() {
      var hash = window.location.hash || "#/";
      var path = hash.replace(/^#/, "").split("?")[0] || "/";
      if (["/", "/doi-soat", "/fms", "/cai-dat"].indexOf(path) === -1) return "/";
      return path;
    }

    function go(path) {
      if (currentPath() === path) {
        state.route = path;
        renderRoute();
        return;
      }
      window.location.hash = "#" + path;
    }

    function updateNav() {
      document.querySelectorAll("[data-route]").forEach(function (el) {
        el.classList.toggle("active", el.getAttribute("data-route") === state.route);
      });
    }

    function pageTitle(kicker, title, description, actionHtml) {
      return '<section class="page-heading">' +
        '<div><span class="kicker">' + esc(kicker) + '</span><h1>' + esc(title) + '</h1><p class="lead">' + description + '</p></div>' +
        (actionHtml || "") +
        '</section>';
    }

    function renderHome() {
      return '<div class="page">' +
        '<section class="card hero">' +
          '<span class="kicker">Pleiku 03 · Audit workspace</span>' +
          '<h1>Theo dõi và đối soát dữ liệu vận hành rõ ràng hơn.</h1>' +
          '<p class="lead">Tổng hợp dữ liệu aging từ Google Sheet và dữ liệu FMS từ SPX để tra cứu Trip, TO, SPX Tracking Number và trạng thái cuối nhanh hơn.</p>' +
          '<div class="hero-actions">' +
            '<button class="btn btn-primary" data-go="/doi-soat">✓ Mở đối soát →</button>' +
            '<button class="btn" data-go="/fms">▦ Xem dữ liệu FMS</button>' +
          '</div>' +
        '</section>' +
        '<section class="grid-3">' +
          '<button class="card feature" style="text-align:left" data-go="/doi-soat"><span class="feature-icon">✓</span><h3>Đối soát aging</h3><p>Xem nhóm 24H → 36H và &gt; 36H từ sheet raw. Có search, filter và phân trang.</p></button>' +
          '<button class="card feature" style="text-align:left" data-go="/fms"><span class="feature-icon">▦</span><h3>Dữ liệu FMS</h3><p>Lấy toàn bộ danh sách FMS, ghép trạng thái cuối và phân nhóm theo thời gian đã qua.</p></button>' +
          '<button class="card feature" style="text-align:left" data-go="/cai-dat"><span class="feature-icon">⚿</span><h3>Cookie SPX</h3><p>Lưu Cookie trên thiết bị hiện tại để dùng cho dữ liệu FMS.</p></button>' +
        '</section>' +
        '<footer class="footer">Pleiku 03 · Audit workspace</footer>' +
      '</div>';
    }

    function normalizeDoiResult(value) {
      var rawRows = value && Array.isArray(value.rows) ? value.rows : Array.isArray(value) ? value : [];
      var rows = rawRows.reduce(function (result, item) {
        if (!item || typeof item !== "object") return result;
        var aging = normalizeText(item.aging_group);
        if (aging !== "24H -> 36H" && aging !== "> 36H") return result;
        result.push({
          trip_number: normalizeText(item.trip_number),
          to_number: normalizeText(item.to_number),
          fleet_order_id: normalizeText(item.fleet_order_id),
          bulky_type: normalizeText(item.bulky_type),
          arrived_time: normalizeText(item.arrived_time),
          last_status_tracking: normalizeText(item.last_status_tracking),
          aging_group: aging
        });
        return result;
      }, []);
      return {
        rows: rows,
        total: rows.length,
        count24To36: rows.filter(function (r) { return r.aging_group === "24H -> 36H"; }).length,
        countOver36: rows.filter(function (r) { return r.aging_group === "> 36H"; }).length
      };
    }

    function doiBulkyOptions() {
      var seen = {};
      state.doi.rows.forEach(function (r) {
        var value = normalizeText(r.bulky_type);
        if (value) seen[value] = true;
      });
      return Object.keys(seen).sort(function (a, b) { return a.localeCompare(b, "vi", { numeric: true }); });
    }

    function getDoiFilteredRows() {
      var keyword = state.doi.search.trim().toLowerCase();
      return state.doi.rows.filter(function (row) {
        if (state.doi.aging !== "ALL" && row.aging_group !== state.doi.aging) return false;
        if (state.doi.bulky !== "ALL" && row.bulky_type !== state.doi.bulky) return false;
        if (!keyword) return true;
        return [row.trip_number, row.to_number, row.fleet_order_id, row.last_status_tracking]
          .some(function (value) { return String(value).toLowerCase().includes(keyword); });
      });
    }

    function agingBadge(group) {
      return group === "> 36H"
        ? '<span class="badge rose">&gt; 36H</span>'
        : '<span class="badge amber">24H → 36H</span>';
    }

    function renderDoiResults() {
      var host = document.getElementById("doi-results");
      if (!host) return;
      if (state.doi.loading && !state.doi.loaded) {
        host.innerHTML = '<div class="loading">Đang tải dữ liệu đối soát...</div>';
        return;
      }

      var rows = getDoiFilteredRows();
      var pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      if (state.doi.page > pages) state.doi.page = pages;
      var start = (state.doi.page - 1) * PAGE_SIZE;
      var pageRows = rows.slice(start, start + PAGE_SIZE);
      var resultStart = rows.length ? start + 1 : 0;
      var resultEnd = Math.min(start + PAGE_SIZE, rows.length);

      var listHtml = pageRows.map(function (row) {
        return '<article class="mobile-card">' +
          '<div class="mobile-top"><div><div class="label">SPX Tracking Number</div><div class="value mono strong">' + esc(row.fleet_order_id || "—") + '</div></div>' + agingBadge(row.aging_group) + '</div>' +
          '<div class="mobile-grid"><div><div class="label">Trip</div><div class="value">' + esc(row.trip_number || "—") + '</div></div><div><div class="label">TO Number</div><div class="value">' + esc(row.to_number || "—") + '</div></div></div>' +
          '<div class="mobile-grid"><div><div class="label">Bulky Type</div><div class="value">' + esc(row.bulky_type || "—") + '</div></div><div><div class="label">Arrived Time</div><div class="value">' + esc(row.arrived_time || "—") + '</div></div></div>' +
          '<div><div class="label">Last Status Tracking</div><div class="value">' + esc(row.last_status_tracking || "—") + '</div></div>' +
        '</article>';
      }).join("");

      var tableHtml = '<div class="table-wrap desktop-table"><table><thead><tr><th>Trip Number</th><th>TO Number</th><th>SPX Tracking Number</th><th>Bulky Type</th><th>Arrived Time</th><th>Last Status Tracking</th><th>Aging Group</th></tr></thead><tbody>' +
        pageRows.map(function (row) {
          return '<tr><td class="strong">' + esc(row.trip_number || "—") + '</td><td>' + esc(row.to_number || "—") + '</td><td class="mono strong">' + esc(row.fleet_order_id || "—") + '</td><td>' + esc(row.bulky_type || "—") + '</td><td>' + esc(row.arrived_time || "—") + '</td><td>' + esc(row.last_status_tracking || "—") + '</td><td>' + agingBadge(row.aging_group) + '</td></tr>';
        }).join("") + '</tbody></table></div>';

      var empty = rows.length === 0 ? '<div class="empty">Không có dữ liệu phù hợp.</div>' : '';
      var pager = '<div class="pager"><span class="pager-info">Hiển thị ' + resultStart + '-' + resultEnd + ' / ' + rows.length + ' kết quả</span><div class="pager-actions"><button class="btn" type="button" data-action="doi-prev" ' + (state.doi.page <= 1 ? 'disabled' : '') + '>← Trước</button><span class="pager-page">Trang ' + state.doi.page + ' / ' + pages + '</span><button class="btn" type="button" data-action="doi-next" ' + (state.doi.page >= pages ? 'disabled' : '') + '>Sau →</button></div></div>';

      host.innerHTML = empty || ('<div class="mobile-list">' + listHtml + '</div>' + tableHtml + pager);
      var count = document.getElementById("doi-count-note");
      if (count) count.textContent = rows.length + " kết quả · " + PAGE_SIZE + " dòng/trang";
    }

    function renderDoi() {
      var bulkyOptions = doiBulkyOptions().map(function (value) {
        return '<option value="' + esc(value) + '" ' + (state.doi.bulky === value ? 'selected' : '') + '>' + esc(value) + '</option>';
      }).join("");

      var html = '<div class="page">' +
        pageTitle('Audit workspace', 'Đối soát', 'Dữ liệu từ sheet <strong>raw</strong>, chỉ hiển thị hai nhóm aging cần audit.', '<button class="btn btn-primary" type="button" data-action="doi-refresh">↻ Làm mới</button>') +
        '<section class="stats"><div class="card stat"><div class="stat-label">Tổng audit</div><div class="stat-value">' + state.doi.total + '</div></div><div class="card stat amber"><div class="stat-label">24H → 36H</div><div class="stat-value">' + state.doi.count24To36 + '</div></div><div class="card stat rose"><div class="stat-label">&gt; 36H</div><div class="stat-value">' + state.doi.countOver36 + '</div></div></section>' +
        '<section class="card panel"><div class="toolbar"><div class="filter-grid">' +
          '<div class="field-wrap"><span class="field-icon">⌕</span><input id="doi-search" class="input with-icon" placeholder="Tìm Trip, TO, SPX Tracking Number, trạng thái..." value="' + esc(state.doi.search) + '"></div>' +
          '<select id="doi-aging" class="select"><option value="ALL">Tất cả Aging Group</option><option value="24H -> 36H" ' + (state.doi.aging === '24H -> 36H' ? 'selected' : '') + '>24H → 36H</option><option value="> 36H" ' + (state.doi.aging === '> 36H' ? 'selected' : '') + '>&gt; 36H</option></select>' +
          '<select id="doi-bulky" class="select"><option value="ALL">Tất cả Bulky Type</option>' + bulkyOptions + '</select>' +
        '</div><div class="toolbar-note"><span>Search theo Trip, TO, Tracking Number và trạng thái cuối</span><span id="doi-count-note">0 kết quả</span></div></div><div id="doi-results"></div></section>' +
      '</div>';

      document.getElementById("app").innerHTML = html;
      bindDoiControls();
      renderDoiResults();
    }

    function bindDoiControls() {
      var search = document.getElementById("doi-search");
      var aging = document.getElementById("doi-aging");
      var bulky = document.getElementById("doi-bulky");
      if (search) search.addEventListener("input", function () { state.doi.search = search.value; state.doi.page = 1; renderDoiResults(); });
      if (aging) aging.addEventListener("change", function () { state.doi.aging = aging.value; state.doi.page = 1; renderDoiResults(); });
      if (bulky) bulky.addEventListener("change", function () { state.doi.bulky = bulky.value; state.doi.page = 1; renderDoiResults(); });
    }

    async function loadDoi(force) {
      if (state.doi.loading || (state.doi.loaded && !force)) return;
      state.doi.loading = true;
      if (state.route === "/doi-soat") renderDoi();
      try {
        var result = normalizeDoiResult(await gasCall("getDoiSoatRaw", []));
        state.doi.rows = result.rows;
        state.doi.total = result.total;
        state.doi.count24To36 = result.count24To36;
        state.doi.countOver36 = result.countOver36;
        state.doi.loaded = true;
        state.doi.page = 1;
      } catch (error) {
        toast(getErrorMessage(error), "error");
      } finally {
        state.doi.loading = false;
        if (state.route === "/doi-soat") renderDoi();
      }
    }

    function asNumber(value) {
      var number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function normalizeTrackingEvent(value) {
      if (!value || typeof value !== "object") return null;
      return {
        id: asNumber(value.id),
        status: asNumber(value.status),
        timestamp: asNumber(value.timestamp),
        message: normalizeText(value.message),
        stationName: normalizeText(value.station_name || value.stationName)
      };
    }

    function normalizeFmsResult(value) {
      var source = value && typeof value === "object" ? value : {};
      var rawRows = Array.isArray(source.rows) ? source.rows : [];
      var rows = rawRows.reduce(function (result, row) {
        if (!row || typeof row !== "object") return result;
        var shipmentId = normalizeText(row.shipment_id || row.shipmentId);
        if (!shipmentId) return result;
        result.push({
          shipmentId: shipmentId,
          currentToNumber: normalizeText(row.current_to_number || row.currentToNumber),
          orderStatus: asNumber(row.order_status || row.orderStatus),
          bulkyType: asNumber(row.bulky_type || row.bulkyType),
          currentStationName: normalizeText(row.current_station_name || row.currentStationName),
          nextStationName: normalizeText(row.next_station_name || row.nextStationName),
          latestTrackingEvent: normalizeTrackingEvent(row.latest_tracking_event || row.latestTrackingEvent),
          trackingError: normalizeText(row.tracking_error || row.trackingError)
        });
        return result;
      }, []);
      return { total: Math.max(asNumber(source.total), rows.length), rows: rows };
    }

    function elapsedHours(timestamp) {
      if (!Number.isFinite(timestamp) || timestamp <= 0) return null;
      return Math.max(0, state.fms.nowMs - timestamp * 1000) / 3600000;
    }

    function elapsedGroup(timestamp) {
      var hours = elapsedHours(timestamp);
      if (hours === null) return "—";
      if (hours < 24) return "< 24H";
      if (hours <= 36) return "24H → 36H";
      return "> 36H";
    }

    function groupRank(group) {
      return group === "> 36H" ? 0 : group === "24H → 36H" ? 1 : group === "< 24H" ? 2 : 3;
    }

    function elapsedText(timestamp) {
      var hours = elapsedHours(timestamp);
      if (hours === null) return "—";
      if (hours < .1) return "< 0.1 giờ";
      return hours.toFixed(1) + " giờ";
    }

    function formatTimestamp(timestamp) {
      if (!Number.isFinite(timestamp) || timestamp <= 0) return "—";
      return new Intl.DateTimeFormat("vi-VN", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false }).format(new Date(timestamp * 1000));
    }

    function statusLabel(event) {
      if (!event) return "—";
      return event.message || ("Status " + event.status);
    }

    function fmsStatusOptions() {
      var seen = {};
      state.fms.rows.forEach(function (row) {
        if (row.latestTrackingEvent) seen[String(row.latestTrackingEvent.status)] = true;
      });
      return Object.keys(seen).sort(function (a, b) { return Number(a) - Number(b); });
    }

    function getFmsFilteredRows() {
      var keyword = state.fms.search.trim().toLowerCase();
      var filtered = state.fms.rows.filter(function (row) {
        var latest = row.latestTrackingEvent;
        if (state.fms.status !== "ALL" && (!latest || String(latest.status) !== state.fms.status)) return false;
        if (state.fms.elapsed !== "ALL" && (!latest || elapsedGroup(latest.timestamp) !== state.fms.elapsed)) return false;
        if (!keyword) return true;
        return [row.shipmentId, row.currentToNumber, latest ? String(latest.status) : "", latest ? statusLabel(latest) : ""]
          .some(function (value) { return String(value).toLowerCase().includes(keyword); });
      });

      return filtered.slice().sort(function (left, right) {
        var le = left.latestTrackingEvent;
        var re = right.latestTrackingEvent;
        var rankDiff = groupRank(le ? elapsedGroup(le.timestamp) : "—") - groupRank(re ? elapsedGroup(re.timestamp) : "—");
        if (rankDiff !== 0) return rankDiff;
        if (!le && !re) return 0;
        if (!le) return 1;
        if (!re) return -1;
        return le.timestamp - re.timestamp;
      });
    }

    function elapsedBadge(group) {
      if (group === "> 36H") return '<span class="badge rose">&gt; 36H</span>';
      if (group === "24H → 36H") return '<span class="badge amber">24H → 36H</span>';
      if (group === "< 24H") return '<span class="badge green">&lt; 24H</span>';
      return '<span class="badge">—</span>';
    }

    function statusHtml(event) {
      if (!event) return "—";
      return '<span class="status-code">' + esc(event.status) + '</span><div class="status-label">' + esc(statusLabel(event)) + '</div>';
    }

    function renderFmsResults() {
      var host = document.getElementById("fms-results");
      if (!host) return;
      if (state.fms.loading && !state.fms.loaded) {
        host.innerHTML = '<div class="loading">Đang tải toàn bộ dữ liệu FMS và trạng thái cuối...</div>';
        return;
      }

      var rows = getFmsFilteredRows();
      var pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      if (state.fms.page > pages) state.fms.page = pages;
      var start = (state.fms.page - 1) * PAGE_SIZE;
      var pageRows = rows.slice(start, start + PAGE_SIZE);
      var resultStart = rows.length ? start + 1 : 0;
      var resultEnd = Math.min(start + PAGE_SIZE, rows.length);

      var mobile = pageRows.map(function (row) {
        var latest = row.latestTrackingEvent;
        var group = latest ? elapsedGroup(latest.timestamp) : "—";
        return '<article class="mobile-card">' +
          '<div class="mobile-top"><div><div class="label">SPX Tracking Number</div><div class="value mono strong">' + esc(row.shipmentId) + '</div></div>' + elapsedBadge(group) + '</div>' +
          '<div><div class="label">TO Number</div><div class="value">' + esc(row.currentToNumber || "—") + '</div></div>' +
          '<div class="mobile-grid"><div><div class="label">Trạng thái cuối</div><div class="value">' + statusHtml(latest) + '</div></div><div><div class="label">Đã qua</div><div class="value strong">' + esc(latest ? elapsedText(latest.timestamp) : "—") + '</div></div></div>' +
          '<div><div class="label">Cập nhật cuối</div><div class="value">' + esc(latest ? formatTimestamp(latest.timestamp) : "—") + '</div></div>' +
          (row.trackingError ? '<div class="value" style="color:#a9274d">' + esc(row.trackingError) + '</div>' : '') +
        '</article>';
      }).join("");

      var table = '<div class="table-wrap desktop-table"><table><thead><tr><th>SPX Tracking Number</th><th>TO Number</th><th>Trạng thái cuối</th><th>Cập nhật cuối</th><th>Đã qua</th><th>Nhóm thời gian</th></tr></thead><tbody>' +
        pageRows.map(function (row) {
          var latest = row.latestTrackingEvent;
          var group = latest ? elapsedGroup(latest.timestamp) : "—";
          return '<tr><td class="mono strong">' + esc(row.shipmentId) + '</td><td class="mono">' + esc(row.currentToNumber || "—") + '</td><td>' + statusHtml(latest) + '</td><td>' + esc(latest ? formatTimestamp(latest.timestamp) : "—") + '</td><td class="strong">' + esc(latest ? elapsedText(latest.timestamp) : "—") + '</td><td>' + elapsedBadge(group) + '</td></tr>';
        }).join("") + '</tbody></table></div>';

      var empty = rows.length === 0 ? '<div class="empty">Không có dữ liệu phù hợp.</div>' : '';
      var pager = '<div class="pager"><span class="pager-info">Hiển thị ' + resultStart + '-' + resultEnd + ' / ' + rows.length + ' kết quả</span><div class="pager-actions"><button class="btn" data-action="fms-prev" ' + (state.fms.page <= 1 ? 'disabled' : '') + '>← Trước</button><span class="pager-page">Trang ' + state.fms.page + ' / ' + pages + '</span><button class="btn" data-action="fms-next" ' + (state.fms.page >= pages ? 'disabled' : '') + '>Sau →</button></div></div>';

      host.innerHTML = empty || ('<div class="mobile-list">' + mobile + '</div>' + table + pager);
      var note = document.getElementById("fms-count-note");
      if (note) note.textContent = rows.length + " kết quả · " + PAGE_SIZE + " đơn/trang";
    }

    function renderFms() {
      var config = getConfig();
      if (!config.cookies.trim()) {
        document.getElementById("app").innerHTML = '<div class="page">' +
          pageTitle('SPX FMS', 'Dữ liệu FMS', 'Lấy danh sách đơn và trạng thái cuối từ FMS.') +
          '<section class="card notice"><span class="notice-icon">⚿</span><div><h2>Chưa có SPX Cookie</h2><p>Hãy nhập Cookie trong tab Cookie trên thiết bị này trước khi tải dữ liệu FMS.</p></div><button class="btn btn-primary" data-go="/cai-dat">Mở cài đặt Cookie</button></section>' +
        '</div>';
        return;
      }

      var statusOptions = fmsStatusOptions().map(function (status) {
        var sample = state.fms.rows.find(function (row) { return row.latestTrackingEvent && String(row.latestTrackingEvent.status) === status; });
        var label = sample && sample.latestTrackingEvent ? statusLabel(sample.latestTrackingEvent) : ("Status " + status);
        return '<option value="' + esc(status) + '" ' + (state.fms.status === status ? 'selected' : '') + '>' + esc(status + " · " + label) + '</option>';
      }).join("");

      var html = '<div class="page">' +
        pageTitle('SPX FMS', 'Dữ liệu FMS', 'Mỗi SPX chỉ hiển thị trạng thái cuối và được phân nhóm theo thời gian đã qua: &lt; 24H, 24H → 36H và &gt; 36H.', '<button class="btn btn-primary" type="button" data-action="fms-refresh">↻ Làm mới</button>') +
        '<section class="card panel"><div class="toolbar"><div class="filter-grid">' +
          '<div class="field-wrap"><span class="field-icon">⌕</span><input id="fms-search" class="input with-icon" placeholder="Tìm SPX, TO, mã hoặc tên trạng thái..." value="' + esc(state.fms.search) + '"></div>' +
          '<select id="fms-elapsed" class="select"><option value="ALL">Tất cả nhóm thời gian</option><option value="< 24H" ' + (state.fms.elapsed === '< 24H' ? 'selected' : '') + '>&lt; 24H</option><option value="24H → 36H" ' + (state.fms.elapsed === '24H → 36H' ? 'selected' : '') + '>24H → 36H</option><option value="> 36H" ' + (state.fms.elapsed === '> 36H' ? 'selected' : '') + '>&gt; 36H</option></select>' +
          '<select id="fms-status" class="select"><option value="ALL">Tất cả trạng thái cuối</option>' + statusOptions + '</select>' +
        '</div><div class="toolbar-note"><span>Sắp xếp ưu tiên: &gt; 36H → 24H → 36H → &lt; 24H</span><span id="fms-count-note">0 kết quả</span></div></div><div id="fms-results"></div></section>' +
      '</div>';

      document.getElementById("app").innerHTML = html;
      bindFmsControls();
      renderFmsResults();
    }

    function bindFmsControls() {
      var search = document.getElementById("fms-search");
      var elapsed = document.getElementById("fms-elapsed");
      var status = document.getElementById("fms-status");
      if (search) search.addEventListener("input", function () { state.fms.search = search.value; state.fms.page = 1; renderFmsResults(); });
      if (elapsed) elapsed.addEventListener("change", function () { state.fms.elapsed = elapsed.value; state.fms.page = 1; renderFmsResults(); });
      if (status) status.addEventListener("change", function () { state.fms.status = status.value; state.fms.page = 1; renderFmsResults(); });
    }

    async function loadFms(force) {
      if (state.fms.loading || (state.fms.loaded && !force)) return;
      var cookie = getConfig().cookies.trim();
      if (!cookie) return;
      state.fms.loading = true;
      if (state.route === "/fms") renderFms();
      try {
        var result = normalizeFmsResult(await gasCall("getFmsData", [cookie, 1]));
        state.fms.rows = result.rows;
        state.fms.total = result.total;
        state.fms.nowMs = Date.now();
        state.fms.loaded = true;
        state.fms.page = 1;
      } catch (error) {
        toast(getErrorMessage(error), "error");
      } finally {
        state.fms.loading = false;
        if (state.route === "/fms") renderFms();
      }
    }

    function renderSettings() {
      var config = getConfig();
      var hasCookie = !!config.cookies.trim();
      var html = '<div class="settings">' +
        pageTitle('Cấu hình', 'Cài đặt Cookie', 'Lưu SPX Cookie dùng cho yêu cầu FMS trên thiết bị hiện tại.') +
        '<section class="card panel"><div class="settings-head"><div><h2 style="margin-bottom:4px">⚿ SPX Cookie</h2><p class="lead">Cookie chỉ được lưu cục bộ trong trình duyệt của thiết bị đang sử dụng.</p></div><span class="badge ' + (hasCookie ? 'green' : 'amber') + '">' + (hasCookie ? 'Đã nhập' : 'Chưa có') + '</span></div>' +
        '<div class="settings-body"><label class="strong" for="spx-cookie">Cookie của tài khoản SPX</label><textarea id="spx-cookie" class="textarea" autocomplete="off" spellcheck="false" placeholder="Dán Cookie SPX tại đây...">' + esc(config.cookies) + '</textarea><div class="settings-actions"><button class="btn btn-danger" type="button" data-action="cookie-clear" ' + (!hasCookie ? 'disabled' : '') + '>Xóa Cookie</button><button class="btn btn-primary" type="button" data-action="cookie-save">Lưu Cookie</button></div></div></section>' +
      '</div>';
      document.getElementById("app").innerHTML = html;
    }

    function renderRoute() {
      state.route = currentPath();
      updateNav();

      if (state.route === "/") {
        document.getElementById("app").innerHTML = renderHome();
        return;
      }

      if (state.route === "/doi-soat") {
        renderDoi();
        if (!state.doi.loaded && !state.doi.loading) loadDoi(false);
        return;
      }

      if (state.route === "/fms") {
        renderFms();
        if (getConfig().cookies.trim() && !state.fms.loaded && !state.fms.loading) loadFms(false);
        return;
      }

      renderSettings();
    }

    document.addEventListener("click", function (event) {
      var target = event.target.closest("[data-go],[data-action]");
      if (!target) return;
      var goTo = target.getAttribute("data-go");
      if (goTo) {
        go(goTo);
        return;
      }

      var action = target.getAttribute("data-action");
      if (action === "doi-refresh") loadDoi(true);
      if (action === "doi-prev") { state.doi.page = Math.max(1, state.doi.page - 1); renderDoiResults(); }
      if (action === "doi-next") { state.doi.page += 1; renderDoiResults(); }
      if (action === "fms-refresh") loadFms(true);
      if (action === "fms-prev") { state.fms.page = Math.max(1, state.fms.page - 1); renderFmsResults(); }
      if (action === "fms-next") { state.fms.page += 1; renderFmsResults(); }
      if (action === "cookie-save") {
        var textarea = document.getElementById("spx-cookie");
        var value = textarea ? textarea.value.trim() : "";
        saveConfig(value);
        state.fms.loaded = false;
        state.fms.rows = [];
        toast(value ? "Đã lưu SPX Cookie." : "Đã xóa SPX Cookie.", value ? "success" : "info");
        renderSettings();
      }
      if (action === "cookie-clear") {
        if (!window.confirm("Xóa SPX Cookie đang lưu trên thiết bị này?")) return;
        saveConfig("");
        state.fms.loaded = false;
        state.fms.rows = [];
        toast("Đã xóa SPX Cookie.", "info");
        renderSettings();
      }
    });

    window.addEventListener("hashchange", renderRoute);

    window.setInterval(function () {
      state.fms.nowMs = Date.now();
      if (state.route === "/fms" && state.fms.loaded) renderFmsResults();
    }, 60000);

    if (!window.location.hash) window.location.hash = "#/";
    renderRoute();
  })();
  </script>
</body>
</html>
